<!DOCTYPE html>
<!-- init-project feature_map viewer 模板：生成时用 docs/feature_map.json（压缩后）替换 seed 标签内的唯一占位符，产物写到目标项目 docs/feature_map.html。勿在本文件内内嵌真实数据。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel World — 功能依赖图谱</title>
<style>
:root{
	--bg:#15171e; --bg2:#1b1e27; --bg3:#222633; --panel:#1e222d; --line:#2e3342;
	--text:#d8dce6; --dim:#8b92a5; --faint:#5d6475;
	--accent:#e8b04b; --accent-dim:#a87f2f;
	--green:#7bc96f; --red:#e06c6c; --blue:#6fa8d8; --purple:#b48edd; --teal:#5fbfb0;
	--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== top bar ===== */
#topbar{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
#topbar h1{font-size:15px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
#topbar h1 .px{color:var(--accent)}
#searchwrap{flex:1;max-width:460px;position:relative}
#search{width:100%;padding:7px 30px 7px 32px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:13px;outline:none}
#search:focus{border-color:var(--accent-dim)}
#searchwrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
#searchwrap .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:var(--mono)}
.stats{display:flex;gap:8px;margin-left:auto}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--dim);white-space:nowrap}
.stat b{color:var(--text);font-family:var(--mono);font-size:13px}
.stat.acc b{color:var(--green)}
button.ghost{background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--dim);padding:5px 10px;font-size:12px;cursor:pointer}
button.ghost:hover{color:var(--text);border-color:var(--accent-dim)}

/* ===== layout ===== */
#main{display:flex;height:calc(100% - 52px)}
#sidebar{width:302px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto}
#content{flex:1;overflow-y:auto;padding:22px 28px 80px}

/* ===== sidebar tabs ===== */
#sideTabs{display:flex;gap:6px;padding:10px 12px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:3}
.stab{flex:1;text-align:center;padding:6px 0;border-radius:6px;font-size:12.5px;color:var(--dim);cursor:pointer;border:1px solid var(--line);background:var(--bg3)}
.stab:hover{color:var(--text)}
.stab.on{color:var(--accent);border-color:var(--accent-dim);background:rgba(232,176,75,.08)}

/* ===== feature tree ===== */
.sidebody{padding:8px 0 40px}
.cat{margin-bottom:2px}
.cat-head{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;user-select:none;border-radius:6px}
.cat-head:hover{background:var(--bg3)}
.cat-head .caret{color:var(--faint);font-size:10px;width:10px;transition:transform .15s}
.cat.open .caret{transform:rotate(90deg)}
.cat-head .ci{font-size:15px}
.cat-head .cn{font-weight:600;font-size:13px}
.cat-head .cc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);background:var(--bg3);border-radius:8px;padding:0 7px}
.feats{display:none}
.cat.open .feats{display:block}
.feat{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 30px;cursor:pointer;user-select:none;border-radius:6px;font-size:12.5px;color:var(--dim)}
.feat:hover{background:var(--bg3);color:var(--text)}
.feat.sel{background:var(--bg3);color:var(--accent)}
.feat .fc{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.feat.sel .fc{color:var(--accent-dim)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ===== folder tree ===== */
.dhead{font-weight:600;color:var(--text)}
.dhead .fc{margin-left:auto}
.fleaf .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fleaf .dots{display:inline-flex;gap:2px;margin-left:auto;align-items:center;flex-shrink:0}
.rk{width:24px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--faint);flex-shrink:0}
.rk.top{color:var(--accent);font-weight:700}

/* ===== content ===== */
.crumb{font-size:12px;color:var(--faint);margin-bottom:6px}
.crumb a{color:var(--dim);cursor:pointer;text-decoration:none}
.crumb a:hover{color:var(--accent)}
.h2row{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.h2row .ci{font-size:22px}
h2{font-size:19px;font-weight:700}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.fdesc{color:var(--dim);font-size:13.5px;max-width:820px;margin:8px 0 16px}
.childchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:12px;color:var(--dim);cursor:pointer}
.chip:hover{border-color:var(--accent-dim);color:var(--text)}

h3{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.4px;margin:20px 0 8px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:500;font-size:11.5px;padding:5px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:rgba(232,176,75,.04)}
td.path{font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap}
td.path:hover{color:var(--accent)}
td.role{color:var(--dim);font-size:12.5px}
td.lines{text-align:right;font-family:var(--mono);color:var(--faint);font-size:12px;white-space:nowrap}
td.tnote{color:var(--dim);font-size:12.5px}
td.badges{white-space:normal;min-width:140px;max-width:260px}
.fbadge{display:inline-block;font-size:10.5px;line-height:17px;padding:0 7px;border-radius:4px;border:1px solid;cursor:pointer;margin:1px 0 1px 4px;white-space:nowrap}
.fbadge:hover{filter:brightness(1.25)}
.shared{display:inline-block;margin-left:6px;font-size:10px;color:var(--purple);border:1px solid var(--purple);border-radius:3px;padding:0 4px;opacity:.8}
.ext{display:inline-block;font-family:var(--mono);font-size:10px;border-radius:3px;padding:0 5px;margin-right:7px;vertical-align:1px}
.ext.gd{color:var(--blue);background:rgba(111,168,216,.12)}
.ext.tscn{color:var(--teal);background:rgba(95,191,176,.12)}
.ext.shader{color:var(--purple);background:rgba(180,142,221,.12)}
.ext.config,.ext.data{color:var(--accent);background:rgba(232,176,75,.12)}
.ext.mjs,.ext.sh,.ext.py{color:var(--green);background:rgba(123,201,111,.12)}
.ext.md{color:var(--dim);background:rgba(139,146,165,.12)}
.ext.dir{color:var(--faint);background:rgba(93,100,117,.15)}

/* search results */
.sr-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.sr-item:hover{border-color:var(--accent-dim)}
.sr-path{font-family:var(--mono);font-size:13px}
.sr-meta{color:var(--dim);font-size:12px;margin-top:3px}
.sr-feats{margin-top:5px;display:flex;flex-wrap:wrap;gap:2px}

/* file detail */
.fdetail{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;max-width:760px}
.fdetail .fp{font-family:var(--mono);font-size:15px;word-break:break-all}
.fdetail .meta{color:var(--dim);font-size:12.5px;margin:8px 0}
.fdetail ul{list-style:none;margin-top:6px}
.fdetail li{padding:4px 0;font-size:13px;cursor:pointer;color:var(--dim);display:flex;align-items:center;gap:8px}
.fdetail li:hover{color:var(--accent)}

/* coverage view */
.cov-note{color:var(--dim);font-size:13px;max-width:820px;margin-bottom:14px}
.vend{display:flex;gap:10px;flex-wrap:wrap}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:240px}
.vcard .vn{font-weight:600;font-size:13.5px}
.vcard .vm{color:var(--dim);font-size:12px;margin-top:3px}
.empty{color:var(--faint);font-size:13px;padding:20px 0}
#content code{font-family:var(--mono);font-size:12.5px;background:var(--bg3);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>

<div id="topbar">
	<h1><span class="px">▪</span> Pixel World · 功能依赖图谱</h1>
	<div id="searchwrap">
		<span class="icon">⌕</span>
		<input id="search" type="text" placeholder="搜索文件路径 / 功能名…" autocomplete="off">
		<span class="kbd">/</span>
	</div>
	<div class="stats" id="stats"></div>
	<button class="ghost" id="expandAll">展开全部</button>
	<button class="ghost" id="covBtn">覆盖率 ⊕</button>
</div>

<div id="main">
	<nav id="sidebar"></nav>
	<div id="content"></div>
</div>

命令集"},{"path":"addons/panku_console/","type":"dir","role":"vendored 控制台 v1.7.9（98 .gd + 2 shader，autoload）"}]},{"id":"debug.mcp","name":"MCP 调试桥（breakpoint_mcp）","desc":"vendored 调试插件 v1.23.0（autoload BreakpointRuntimeBridge）：loopback JSON 桥接编辑器 9080 / 运行时 9081 给 MCP host；godot MCP 工具按会话激活（BREAKPOINT_TOOLSETS=runtime,dap,knowledge）。","files":[{"path":"addons/breakpoint_mcp/","type":"dir","role":"vendored 调试桥 v1.23.0（9 .gd；含独立 CLAUDE.md）"}]},{"id":"debug.fx","name":"pixelfx 特效","desc":"vendored 像素特效库 v0.3.0（244 特效/24 类，PixelFx2D BAKED/LIVE + PixelFxAct2D）：画廊场景全量浏览 + 离线烘焙导出缩略图。","files":[{"path":"addons/pixelfx/","type":"dir","role":"vendored 特效库 v0.3.0（290 .gd，MIT）"},{"path":"scripts/scenes/pixelfx_gallery.gd","type":"gd","lines":599,"role":"特效画廊（244 缩略图墙）"},{"path":"scenes/PixelFxGallery.tscn","type":"tscn","role":"画廊场景"},{"path":"scripts/tools/pixelfx_export.gd","type":"gd","lines":48,"role":"离线烘焙特效缩略图 png"}],"tests":[{"path":"tests/pixelfx_contract.gd","note":"特效契约"}]},{"id":"debug.pipeline","name":"素材切片与音频管线（离线工具）","desc":"精灵图切片（职业 turnaround/UI sheet）、art/audio 注册表生成、语音切分。不参与运行时。","files":[{"path":"tools/art/gen_art_registry.py","type":"py","role":"art 注册表生成"},{"path":"tools/art/gen_turnarounds.sh","type":"sh","role":"turnaround 生成"},{"path":"tools/slice_class_sheets.py","type":"py","role":"职业精灵图切片"},{"path":"tools/slice_ui_sheet.py","type":"py","role":"UI 图集切片"},{"path":"tools/audio/gen_voice_registry.py","type":"py","role":"语音注册表生成"},{"path":"tools/audio/split_voices.py","type":"py","role":"语音切分"},{"path":"tools/audio/split_voices.sh","type":"sh","role":"语音切分入口"},{"path":"meowa_tiles/generated/remove_fake_transparency.py","type":"py","role":"素材伪透明清理（离线）"}]}]},{"id":"quality","name":"测试基础设施","icon":"✅","desc":"无框架契约测试体系：headless --script 契约（78 个，挂在各功能下）+ 共享 fixtures + 全量基线脚本。地形测试用固化 SHA-256 快照检测回归。","children":[{"id":"quality.infra","name":"基线与 fixtures","desc":"run_contract_baseline.sh 单测超时 900s 逐份收退出码；fixtures 供模块扩展契约使用；debug_test 是 Phase 1 自测 autoload。2026-1 <script>
'use strict';
/* ---------- data ---------- */
let DATA = null;
try { DATA = JSON.parse(document.getElementById('seed').textContent); } catch (e) { console.error(e); }
// prefer live file (works when served over http); fall back to embedded seed
fetch('feature_map.json').then(r => r.ok ? r.json() : null).then(j => { if (j) { DATA = j; boot(); } }).catch(() => {});

/* ---------- index ---------- */
let FEATURES = [];            // {id,name,desc,cat,icon,catId,node}
let FILE_INDEX = {};          // path -> [{feat, role, lines, type, note}]
let TEST_INDEX = {};          // test path (tscn-stripped) -> [featId]
let FOLDER_ROOT = null;       // folder trie
let ALL_DIR_PATHS = [];
let RANKED = [];              // top-100 files by lines
const TYPE_ORDER = {gd:0,tscn:1,shader:2,config:3,data:4,mjs:5,sh:6,py:7,md:8,dir:9};

function indexData() {
	FEATURES = []; FILE_INDEX = {}; TEST_INDEX = {};
	DATA.tree.forEach(cat => {
		cat.children.forEach(f => {
			FEATURES.push({ id:f.id, name:f.name, desc:f.desc||'', cat:cat.name, icon:cat.icon, catId:cat.id, node:f });
			(f.files||[]).forEach(x => {
				(FILE_INDEX[x.path] = FILE_INDEX[x.path] || []).push({ feat:f.id, role:x.role||'', lines:x.lines, type:x.type, note:x.note });
			});
			(f.tests||[]).forEach(t => {
				const key = t.path.replace(/\.tscn$/, '');
				TEST_INDEX[key] = TEST_INDEX[key] || [];
				TEST_INDEX[key].push(f.id);
				(FILE_INDEX[t.path] = FILE_INDEX[t.path] || []).push({ feat:f.id, role:t.note||'契约测试', lines:null, type:t.type||'gd', note:t.note });
			});
		});
	});
}
const featById = id => FEATURES.find(f => f.id === id);
const fileCount = f => (f.node.files||[]).length + (f.node.tests||[]).length;
const ownersOf = refs => [...new Set((refs||[]).map(r => r.feat))];

/* ---------- folder trie ---------- */
function buildFolders() {
	FOLDER_ROOT = { name:'', path:'', dirs:{}, files:[] };
	Object.keys(FILE_INDEX).sort().forEach(p => {
		const parts = p.split('/');
		let node = FOLDER_ROOT;
		for (let i = 0; i < parts.length - 1; i++) {
			const d = parts[i];
			if (!node.dirs[d]) node.dirs[d] = { name:d, path:(node.path ? node.path+'/' : '')+d, dirs:{}, files:[] };
			node = node.dirs[d];
		}
		node.files.push(p);
	});
	ALL_DIR_PATHS = [];
	(function cnt(n){
		let c = n.files.length;
		for (const k in n.dirs) { c += cnt(n.dirs[k]); ALL_DIR_PATHS.push(n.dirs[k].path); }
		n.count = c; return c;
	})(FOLDER_ROOT);
}
function findDir(path) {
	if (!path) return FOLDER_ROOT;
	let n = FOLDER_ROOT;
	for (const p of path.split('/')) { n = n.dirs[p]; if (!n) return null; }
	return n;
}
const dirOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };

/* ---------- feature colors (text hash -> hue) ---------- */
function hashHue(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
const FEAT_HUE = {};
function featHue(id){ if (!(id in FEAT_HUE)) { const f = featById(id); FEAT_HUE[id] = hashHue(f ? f.name : id); } return FEAT_HUE[id]; }
function featBadge(id){
	const f = featById(id); if (!f) return '';
	const h = featHue(id);
	return `<span class="fbadge" data-go="${id}" style="background:hsl(${h},45%,20%);border-color:hsl(${h},45%,36%);color:hsl(${h},80%,74%)" title="${f.cat} · ${f.name}">${f.name}</span>`;
}
function featDot(id){ return `<span class="dot" style="background:hsl(${featHue(id)},55%,55%)"></span>`; }

/* ---------- sidebar ---------- */
function renderSidebar() {
	const sb = document.getElementById('sidebar');
	sb.innerHTML = '';
	const tabs = document.createElement('div');
	tabs.id = 'sideTabs';
	tabs.innerHTML = `<div class="stab ${state.sideView==='feat'?'on':''}" data-tab="feat">🗂 功能</div>
	                  <div class="stab ${state.sideView==='folder'?'on':''}" data-tab="folder">📁 文件夹</div>
	                  <div class="stab ${state.sideView==='rank'?'on':''}" data-tab="rank">📊 Top100</div>`;
	tabs.querySelectorAll('.stab').forEach(t => t.onclick = () => { if (state.sideView !== t.dataset.tab) { state.sideView = t.dataset.tab; renderSidebar(); } });
	sb.appendChild(tabs);
	const body = document.createElement('div');
	body.className = 'sidebody';
	sb.appendChild(body);
	if (state.sideView === 'feat') renderSidebarFeat(body);
	else if (state.sideView === 'folder') renderSidebarFolder(body);
	else renderSidebarRank(body);
}

function renderSidebarFeat(sb) {
	DATA.tree.forEach(cat => {
		const div = document.createElement('div');
		div.className = 'cat' + (cat.id === 'quality' ? '' : ' open');
		const nFiles = cat.children.reduce((a,f) => a + (f.files||[]).length, 0);
		div.innerHTML = `<div class="cat-head"><span class="caret">▶</span><span class="ci">${cat.icon}</span><span class="cn">${cat.name}</span><span class="cc">${cat.children.length}·${nFiles}</span></div>`;
		const list = document.createElement('div');
		list.className = 'feats';
		cat.children.forEach(f => {
			const el = document.createElement('div');
			el.className = 'feat' + (state.view === 'feat' && state.sel === f.id ? ' sel' : '');
			el.innerHTML = `${featDot(f.id)}<span>${f.name}</span><span class="fc">${fileCount({node:f})}</span>`;
			el.onclick = () => select(f.id);
			list.appendChild(el);
		});
		div.firstChild.onclick = () => div.classList.toggle('open');
		div.appendChild(list);
		sb.appendChild(div);
	});
}

function renderSidebarFolder(sb) {
	function drawDir(node, depth, container) {
		Object.keys(node.dirs).sort().forEach(name => {
			const d = node.dirs[name];
			const open = state.openDirs.has(d.path);
			const head = document.createElement('div');
			head.className = 'feat dhead' + (state.view === 'folder' && state.folder === d.path ? ' sel' : '');
			head.style.paddingLeft = (12 + depth * 13) + 'px';
			head.innerHTML = `<span style="font-size:9px;color:var(--faint);width:9px;flex-shrink:0">${open?'▼':'▶'}</span><span>📁 ${name}</span><span class="fc">${d.count}</span>`;
			const kids = document.createElement('div');
			kids.style.display = open ? '' : 'none';
			head.onclick = () => {
				if (state.openDirs.has(d.path)) { state.openDirs.delete(d.path); kids.style.display='none'; head.firstChild.textContent='▶'; }
				else { state.openDirs.add(d.path); kids.style.display=''; head.firstChild.textContent='▼'; }
				renderFolder(d.path); markSel(head);
			};
			container.appendChild(head); container.appendChild(kids);
			drawDir(d, depth + 1, kids);
		});
		node.files.slice().sort((a,b) => a.split('/').pop().localeCompare(b.split('/').pop())).forEach(p => {
			const el = document.createElement('div');
			el.className = 'feat fleaf' + (state.view === 'file' && state.file === p ? ' sel' : '');
			el.style.paddingLeft = (12 + depth * 13 + 17) + 'px';
			el.title = p;
			const feats = ownersOf(FILE_INDEX[p]);
			const dots = feats.slice(0, 3).map(featDot).join('');
			el.innerHTML = `<span style="font-size:10px;opacity:.7">📄</span><span class="fname">${p.split('/').pop()}</span><span class="dots">${dots}${feats.length>3?`<span class="fc" style="font-size:9px">+${feats.length-3}</span>`:''}</span>`;
			el.onclick = () => { state.view = 'file'; state.file = p; markSel(el); renderFile(p); };
			container.appendChild(el);
		});
	}
	function markSel(el) {
		sb.querySelectorAll('.feat.sel').forEach(x => x.classList.remove('sel'));
		el.classList.add('sel');
	}
	drawDir(FOLDER_ROOT, 0, sb);
	// root-level files (e.g. main.gd) live in FOLDER_ROOT.files — drawn above at depth 0 already
}

function renderSidebarRank(sb) {
	if (!RANKED.length) { sb.innerHTML = '<div class="empty" style="padding:16px 12px">无行数数据</div>'; return; }
	const max = RANKED[0].lines;
	RANKED.forEach((x, i) => {
		const el = document.createElement('div');
		el.className = 'feat' + (state.view === 'file' && state.file === x.p ? ' sel' : '');
		const w = Math.max(3, Math.round(x.lines / max * 100));
		el.style.background = `linear-gradient(90deg, rgba(232,176,75,.09) ${w}%, transparent ${w}%)`;
		el.title = `${x.p} — ${x.lines.toLocaleString()} 行`;
		const name = x.p.split('/').pop(), dir = dirOf(x.p);
		el.innerHTML = `<span class="rk ${i < 3 ? 'top' : ''}">${i + 1}</span>
			<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b style="font-weight:600">${name}</b> <span style="color:var(--faint);font-size:10.5px">${dir ? dir + '/' : ''}</span></span>
			<span style="display:inline-flex;gap:2px;flex-shrink:0">${x.feats.slice(0, 2).map(featDot).join('')}</span>
			<span class="fc" style="margin-left:6px">${x.lines.toLocaleString()}</span>`;
		el.onclick = () => {
			state.view = 'file'; state.file = x.p;
			sb.querySelectorAll('.feat.sel').forEach(y => y.classList.remove('sel'));
			el.classList.add('sel'); renderFile(x.p);
		};
		sb.appendChild(el);
	});
}

/* ---------- content views ---------- */
function extBadge(type) { return type ? `<span class="ext ${type}">${type}</span>` : ''; }

function renderFeature(id) {
	const f = featById(id); if (!f) return;
	const el = document.getElementById('content');
	const files = (f.node.files||[]).slice().sort((a,b) => (TYPE_ORDER[a.type]??9)-(TYPE_ORDER[b.type]??9) || (b.lines||0)-(a.lines||0));
	const tests = f.node.tests || [];
	const totalLines = files.reduce((a,x) => a + (x.lines||0), 0);
	const siblings = DATA.tree.find(c => c.id === f.catId).children.filter(x => x.id !== id);

	el.innerHTML = `
		<div class="crumb"><a data-go="">图谱</a> / <a data-go="${f.catId}">${f.cat}</a> / ${f.name}</div>
		<div class="h2row"><span class="ci">${f.icon}</span><h2>${f.name}</h2><span class="tag">${f.id}</span></div>
		<p class="fdesc">${f.desc}</p>
		${files.length ? `<h3>文件 · ${files.length}（${totalLines.toLocaleString()} 行代码）</h3>
		<table><thead><tr><th style="width:40%">路径</th><th>职责</th><th style="width:70px">行数</th><th style="width:180px">同时属于</th></tr></thead><tbody>
		${files.map(x => {
			const others = ownersOf(FILE_INDEX[x.path]).filter(fid => fid !== id);
			return `<tr><td class="path" data-file="${x.path}">${extBadge(x.type)}${x.path}</td>
			<td class="role">${x.note || x.role || ''}</td>
			<td class="lines">${x.lines ? x.lines.toLocaleString() : ''}</td>
			<td class="badges">${others.map(featBadge).join('') || '<span style="color:var(--faint);font-size:11px">—</span>'}</td></tr>`;
		}).join('')}
		</tbody></table>` : ''}
		${tests.length ? `<h3>契约测试 · ${tests.length}</h3>
		<table><thead><tr><th style="width:44%">测试</th><th>覆盖点</th></tr></thead><tbody>
		${tests.map(t => `<tr><td class="path">${extBadge(t.type||'gd')}${t.path}</td><td class="tnote">${t.note||''}</td></tr>`).join('')}
		</tbody></table>` : ''}
		${siblings.length ? `<h3>同级功能</h3><div class="childchips">${siblings.map(s => `<span class="chip" data-go="${s.id}">${s.name}</span>`).join('')}</div>` : ''}
	`;
}

function renderFolder(path) {
	const node = findDir(path);
	const el = document.getElementById('content');
	if (!node) { el.innerHTML = `<div class="empty">目录不存在：${path}</div>`; return; }
	state.view = 'folder'; state.folder = path;
	const all = [];
	(function walk(n){ n.files.forEach(p => all.push(p)); for (const k in n.dirs) walk(n.dirs[k]); })(node);
	all.sort();
	const subdirs = Object.keys(node.dirs).sort();
	const segs = path ? path.split('/') : [];
	let acc = '';
	const crumbHtml = `<a data-dir="">图谱</a> / <a data-dir="">/</a>` + segs.map(s => { acc = acc ? acc+'/'+s : s; return ` <a data-dir="${acc}">${s}</a>`; }).join(' / ');
	const totalLines = all.reduce((a,p) => { const l = (FILE_INDEX[p]||[]).map(r=>r.lines).find(x=>x); return a + (l||0); }, 0);

	el.innerHTML = `
		<div class="crumb">${crumbHtml}</div>
		<div class="h2row"><span class="ci">📁</span><h2>${path || '（根目录）'}</h2><span class="tag">${all.length} 文件${totalLines?' · '+totalLines.toLocaleString()+' 行':''}</span></div>
		<p class="fdesc">递归列出本目录及子目录的全部收录文件。行尾彩色徽章 = 所属功能（颜色按功能名生成，点徽章跳转功能）——同目录里颜色与邻居格格不入的文件，往往就是放错位置的。</p>
		${subdirs.length ? `<h3>子目录 · ${subdirs.length}</h3>
		<div class="childchips">${subdirs.map(d => `<span class="chip" data-dir="${path?path+'/':''}${d}">📁 ${d} <span style="color:var(--faint)">${node.dirs[d].count}</span></span>`).join('')}</div>` : ''}
		<h3>文件 · ${all.length}（递归）</h3>
		${all.length ? `<table><thead><tr><th style="width:34%">路径</th><th>职责</th><th style="width:70px">行数</th><th style="width:240px">所属功能</th></tr></thead><tbody>
		${all.map(p => {
			const refs = FILE_INDEX[p] || [];
			const r0 = refs.find(r => r.role) || refs[0] || {};
			return `<tr><td class="path" data-file="${p}" title="${p}">${extBadge(r0.type)}${path ? p.slice(path.length+1) : p}</td>
			<td class="role">${r0.role||''}</td>
			<td class="lines">${r0.lines ? r0.lines.toLocaleString() : ''}</td>
			<td class="badges">${ownersOf(refs).map(featBadge).join('')}</td></tr>`;
		}).join('')}
		</tbody></table>` : '<div class="empty">本目录无收录文件</div>'}
	`;
}

function renderFile(path) {
	const refs = FILE_INDEX[path] || [];
	const el = document.getElementById('content');
	const base = path.replace(/\.tscn$/, '');
	const testedBy = TEST_INDEX[base] || [];
	if (!refs.length && !testedBy.length) { el.innerHTML = `<div class="empty">未收录：${path}</div>`; return; }
	state.view = 'file'; state.file = path;
	const seen = new Set(); const uniqRefs = refs.filter(r => !seen.has(r.feat) && seen.add(r.feat));
	const lines = refs.map(r => r.lines).find(x => x) || null;
	const d = dirOf(path);
	el.innerHTML = `
		<div class="crumb"><a data-go="">图谱</a> / <a data-dir="${d}">📁 ${d || '/'}</a> / 文件详情</div>
		<div class="fdetail">
			<div class="fp">${path}</div>
			<div class="meta">${refs[0] ? extBadge(refs[0].type) : ''}${refs[0]?.type||'test'}${lines ? ' · '+lines.toLocaleString()+' 行' : ''} · 被引用于 ${uniqRefs.length} 个功能</div>
			<h3>归属功能</h3>
			<ul>${(uniqRefs.length ? uniqRefs : testedBy.map(fid => ({feat:fid}))).map(r => {
				const f = featById(r.feat); return f ? `<li data-go="${f.id}">${featDot(f.id)}<span>${f.cat} › ${f.name}</span><span style="color:var(--faint);font-size:12px">${r.role||''}</span></li>` : '';
			}).join('')}</ul>
			${testedBy.length && uniqRefs.length ? `<h3>契约测试覆盖</h3><ul>${testedBy.map(fid=>{const f=featById(fid);return `<li data-go="${fid}">${featDot(fid)}<span>✅ ${f?f.name:fid}</span></li>`}).join('')}</ul>` : ''}
		</div>
	`;
}

function renderSearch(q) {
	const el = document.getElementById('content');
	const ql = q.toLowerCase();
	const hits = [];
	Object.entries(FILE_INDEX).forEach(([p, refs]) => {
		if (p.toLowerCase().includes(ql) || refs.some(r => (r.role||'').toLowerCase().includes(ql)))
			hits.push(p);
	});
	const featHits = FEATURES.filter(f => f.name.toLowerCase().includes(ql) || f.id.includes(ql) || (f.desc||'').toLowerCase().includes(ql));
	el.innerHTML = `
		<div class="crumb">搜索「${q}」</div>
		<h2>文件 ${hits.length} · 功能 ${featHits.length}</h2>
		${featHits.length ? `<h3>功能</h3><div class="childchips">${featHits.map(f=>`<span class="chip" data-go="${f.id}">${f.name}</span>`).join('')}</div>` : ''}
		<h3>文件</h3>
		${hits.length ? hits.slice(0,200).map(p => {
			const refs = FILE_INDEX[p];
			const r0 = refs.find(r=>r.lines) || refs[0];
			return `<div class="sr-item" data-file="${p}">
				<div class="sr-path">${extBadge(r0?.type)}${p}</div>
				<div class="sr-meta">${r0?.role||''}${r0?.lines?' · '+r0.lines.toLocaleString()+' 行':''}</div>
				<div class="sr-feats">${ownersOf(refs).map(featBadge).join('')}</div>
			</div>`;
		}).join('') : '<div class="empty">无匹配文件</div>'}
	`;
}

function renderCoverage() {
	const el = document.getElementById('content');
	const mappedFiles = Object.keys(FILE_INDEX).length;
	const v = DATA.vendored || [], u = DATA.unmapped || [];
	el.innerHTML = `
		<div class="crumb"><a data-go="">图谱</a> / 覆盖率</div>
		<h2>覆盖率报告</h2>
		<p class="cov-note">项目自有代码文件（git 追踪，不含 addons 与引擎生成物）已全量映射到 ${FEATURES.length} 个功能节点。
		文件可多归属（shared）；vendored 插件按模块级收录；下方为显式排除项。</p>
		<h3>归属统计</h3>
		<table><tbody>
			<tr><td class="role">功能节点</td><td class="lines">${FEATURES.length}</td></tr>
			<tr><td class="role">收录文件（含场景/着色器/配置/测试，去重）</td><td class="lines">${mappedFiles}</td></tr>
			<tr><td class="role">多归属文件（shared）</td><td class="lines">${Object.values(FILE_INDEX).filter(r=>ownersOf(r).length>1).length}</td></tr>
			<tr><td class="role">vendored 模块</td><td class="lines">${v.length}</td></tr>
		</tbody></table>
		<h3>Vendored 模块（不展开单文件）</h3>
		<div class="vend">${v.map(x=>`<div class="vcard"><div class="vn">${x.path}</div><div class="vm">${x.name} ${x.version} · ~${x.files} .gd<br>${x.role}</div></div>`).join('')}</div>
		${u.length?`<h3>显式排除（${u.length}）</h3>
		<table><tbody>${u.map(x=>`<tr><td class="path" style="cursor:default">${x.path}</td><td class="tnote">${x.reason}</td></tr>`).join('')}</tbody></table>`:''}
	`;
}

/* ---------- router ---------- */
const state = { sel:null, view:'home', sideView:'feat', folder:'', file:'', openDirs:new Set() };
function select(id) { state.sel = id; state.view = 'feat'; renderSidebar(); renderFeature(id); document.getElementById('content').scrollTop = 0; }
function go(target) {
	if (!target) { state.view='home'; renderSidebar(); renderHome(); return; }
	const cat = DATA.tree.find(c=>c.id===target);
	if (cat && !featById(target)) {
		document.querySelectorAll('.cat').forEach((d,i)=>d.classList.toggle('open', DATA.tree[i].id===target));
		select(cat.children[0].id); return;
	}
	select(target);
}
function renderHome() {
	const el = document.getElementById('content');
	el.innerHTML = `
		<div class="crumb">图谱总览</div>
		<h2>Pixel World 功能依赖图谱</h2>
		<p class="fdesc">${DATA.description||''}<br><span style="color:var(--faint);font-size:12px">生成于 ${DATA.generated||''} · HEAD ${DATA.head_commit||''} · 左侧选择功能，或按 <code>/</code> 搜索</span></p>
		<p class="fdesc" style="margin-top:-8px">💡 左侧可切换 <b>📁 文件夹视图</b>（按真实目录树浏览，徽章颜色突兀的文件可能放错位置）或 <b>📊 Top100</b>（按行数排行的前 100 个文件，底色金条 = 相对体量）。文件行尾的彩色徽章 = 所属功能（颜色由功能名生成），点徽章跳功能。</p>
		${DATA.tree.map(cat=>`
			<h3 style="margin-top:26px">${cat.icon} ${cat.name}</h3>
			<div class="childchips">${cat.children.map(f=>`<span class="chip" data-go="${f.id}">${f.name} <span style="color:var(--faint)">${(f.files||[]).length}</span></span>`).join('')}</div>
		`).join('')}
	`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
	const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
	const d = e.target.closest('[data-dir]'); if (d) { renderFolder(d.dataset.dir); document.getElementById('content').scrollTop = 0; return; }
	const f = e.target.closest('[data-file]'); if (f) { renderFile(f.dataset.file); return; }
});
document.getElementById('search').addEventListener('input', e => {
	const q = e.target.value.trim();
	if (!q) { state.view==='home' ? renderHome() : (state.view==='feat' && state.sel) ? renderFeature(state.sel) : state.view==='folder' ? renderFolder(state.folder) : state.file && renderFile(state.file); return; }
	renderSearch(q);
});
document.getElementById('covBtn').onclick = () => renderCoverage();
document.getElementById('expandAll').onclick = () => {
	if (state.sideView === 'feat') {
		const cats = document.querySelectorAll('.cat');
		const anyClosed = [...cats].some(c=>!c.classList.contains('open'));
		cats.forEach(c=>c.classList.toggle('open', anyClosed));
	} else if (state.sideView === 'folder') {
		const anyClosed = ALL_DIR_PATHS.some(p=>!state.openDirs.has(p));
		state.openDirs = anyClosed ? new Set(['', ...ALL_DIR_PATHS]) : new Set(['', ...Object.keys(FOLDER_ROOT.dirs)]);
		renderSidebar();
	}
};
document.addEventListener('keydown', e => {
	if (e.key==='/' && document.activeElement.id!=='search') { e.preventDefault(); document.getElementById('search').focus(); }
	if (e.key==='Escape') { document.getElementById('search').value=''; document.getElementById('search').blur(); }
});

/* ---------- boot ---------- */
function boot() {
	indexData();
	buildFolders();
	RANKED = Object.entries(FILE_INDEX)
		.map(([p, refs]) => ({ p, lines: refs.map(r => r.lines).find(x => x) || 0, feats: ownersOf(refs) }))
		.filter(x => x.lines > 0)
		.sort((a, b) => b.lines - a.lines)
		.slice(0, 100);
	if (!state.openDirs.size) state.openDirs = new Set(['', ...Object.keys(FOLDER_ROOT.dirs)]);
	const totFeatures = FEATURES.length;
	const mapped = Object.keys(FILE_INDEX).length;
	const shared = Object.values(FILE_INDEX).filter(r=>ownersOf(r).length>1).length;
	document.getElementById('stats').innerHTML =
		`<span class="stat">功能 <b>${totFeatures}</b></span>
		 <span class="stat">文件 <b>${mapped}</b></span>
		 <span class="stat">shared <b>${shared}</b></span>
		 <span class="stat acc">覆盖 <b>100%</b></span>`;
	renderSidebar();
	renderHome();
}
if (DATA) boot();
</script>
</body>
</html>
